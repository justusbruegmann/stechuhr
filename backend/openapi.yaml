openapi: 3.0.3
info:
  title: Stechuhr API
  description: API for authentication, user management and time entries.
  version: 0.0.1
servers:
  - url: http://localhost:3500
    description: Local development server
tags:
  - name: Auth
    description: Authentication
  - name: Users
    description: User management
  - name: TimeEntries
    description: Operations on time entries
  - name: Requests
    description: Vacation, sick and other requests (Anträge)
  - name: Summary
    description: Aggregated working time summary for a user
  - name: Notifications
    description: Rule-based notifications (e.g. overtime, undertime)
paths:
  /auth:
    post:
      tags:
        - Auth
      summary: Authenticate a user
      description: >
        Authenticate either by `Authorization`/`userid` headers (session token)
        or by a JSON body containing `username` and `password`.
      operationId: authenticate
      parameters:
        - name: Authorization
          in: header
          required: false
          description: Session token
          schema:
            type: string
        - name: userid
          in: header
          required: false
          description: ID of the user
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  session:
                    type: string
                  role:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "485":
          description: Has one time password (custom status)
          content:
            text/plain:
              schema:
                type: string
              example: Has onetime password
  /users:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    post:
      tags:
        - Users
      summary: Create a user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - role
              properties:
                username:
                  type: string
                role:
                  type: string
                managerId:
                  type: integer
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - Users
      summary: List users
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of users to return
          schema:
            type: integer
            default: 25
        - name: offset
          in: query
          required: false
          description: Number of users to skip
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{id}/otp:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    patch:
      tags:
        - Users
      summary: Change a user's one time password
      operationId: changeOtp
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the user
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentpwd
                - newpwd
              properties:
                currentpwd:
                  type: string
                newpwd:
                  type: string
      responses:
        "200":
          description: Password changed
          content:
            text/plain:
              schema:
                type: string
              example: changed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    delete:
      tags:
        - Users
      summary: Delete a user
      operationId: deleteUser
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the user to delete
          schema:
            type: integer
      responses:
        "204":
          description: User deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/{managerId}/requests:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - Requests
      summary: List all requests a manager is responsible for
      operationId: listRequestsByManager
      parameters:
        - name: managerId
          in: path
          required: true
          description: ID of the responsible manager
          schema:
            type: integer
      responses:
        "200":
          description: List of requests for the manager
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
            $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{userId}/timeentries:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - TimeEntries
      summary: List time entries for a user
      operationId: getTimeEntriesForUser
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the user whose entries are requested
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: Type of time entry to filter by
          schema:
            type: string
        - name: startDate
          in: query
          required: false
          description: Start date
          schema:
            type: string
            format: date-time
        - name: endDate
          in: query
          required: false
          description: End Date
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: List of time entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /timeentries:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    post:
      tags:
        - TimeEntries
      summary: Create a time entry
      operationId: createTimeEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - startTime
                - type
              properties:
                id:
                  type: integer
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                type:
                  type: string
      responses:
        "201":
          description: Time entry created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /timeentries/{id}:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - TimeEntries
      summary: Get a single time entry by ID
      operationId: getTimeEntryById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the time entry
          schema:
            type: string
      responses:
        "200":
          description: The requested time entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - TimeEntries
      summary: Set the end time of a time entry
      operationId: updateTimeEntryEndTime
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the time entry to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - endTime
              properties:
                endTime:
                  type: string
                  format: date-time
      responses:
        "204":
          description: Time entry updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - TimeEntries
      summary: Delete a time entry
      operationId: deleteTimeEntry
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the time entry to delete
          schema:
            type: string
      responses:
        "204":
          description: Time entry deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /requests:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - Requests
      summary: List requests
      operationId: listRequests
      parameters:
        - name: userId
          in: query
          required: false
          description: Filter by the requesting user
          schema:
            type: integer
        - name: managerId
          in: query
          required: false
          description: Filter by the responsible manager
          schema:
            type: integer
        - name: type
          in: query
          required: false
          description: Filter by request type
          schema:
            type: string
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Request"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Requests
      summary: Create a request
      operationId: createRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - type
                - startTime
              properties:
                userId:
                  type: integer
                managerId:
                  type: integer
                type:
                  type: string
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /requests/{id}:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - Requests
      summary: Get a single request by ID
      operationId: getRequestById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the request
          schema:
            type: string
      responses:
        "200":
          description: The requested request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Request"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Requests
      summary: Update a request (e.g. approve or change times)
      operationId: updateRequest
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the request to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approved:
                  type: boolean
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
      responses:
        "204":
          description: Request updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Requests
      summary: Delete a request
      operationId: deleteRequest
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the request to delete
          schema:
            type: string
      responses:
        "204":
          description: Request deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /summary:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - Summary
      summary: Get aggregated working time summary for a user
      operationId: getSummary
      parameters:
        - name: userId
          in: query
          required: true
          description: ID of the user to summarize
          schema:
            type: integer
        - name: startTime
          in: query
          required: true
          description: start time
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: true
          description: end time
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Working time summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /users/{userId}/notifications:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - Notifications
      summary: List notification of UserID
      operationId: listNotifications
      parameters:
        - name: userId
          in: path
          required: true
          description: ID of the userId
          schema:
            type: string
      responses:
        "200":
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /notifications:
    parameters:
    - $ref: "#/components/parameters/AuthorizationHeader"
    - $ref: "#/components/parameters/UserIdHeader"
    post:
      tags:
        - Notifications
      summary: Create notifications for the day before
      operationId: postNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
               - date
              properties:
                date:
                  type: string
                  format: date-time
                
      responses:
        "201":
          $ref: "#/components/responses/CreatedText"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /notifications/{id}:
    parameters:
      - $ref: "#/components/parameters/AuthorizationHeader"
      - $ref: "#/components/parameters/UserIdHeader"
    get:
      tags:
        - Notifications
      summary: Get a single notification by ID
      operationId: getNotificationById
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the notification
          schema:
            type: string
      responses:
        "200":
          description: The requested notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Notifications
      summary: Update a notification (e.g. mark as read)
      operationId: updateNotification
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the notification to update
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - read
              properties:
                read:
                  type: boolean
      responses:
        "204":
          description: Notification updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Notifications
      summary: Delete a notification
      operationId: deleteNotification
      parameters:
        - name: id
          in: path
          required: true
          description: ID of the notification to delete
          schema:
            type: string
      responses:
        "204":
          description: Notification deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
components:
  parameters:
    AuthorizationHeader:
      name: Authorization
      in: header
      required: true
      description: Session token
      schema:
        type: string
    UserIdHeader:
      name: userid
      in: header
      required: true
      description: ID of the requesting user
      schema:
        type: integer
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        managerId:
          type: integer
    TimeEntry:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        type:
          type: string
    Request:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        managerId:
          type: integer
        type:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        approved:
          type: boolean
    Summary:
      type: object
      properties:
        userId:
          type: integer
        month:
          type: string
        workedHours:
          type: number
        workload:
          type: number
        overtime:
          type: number
        holidayDaysLeft:
          type: number
        openRequests:
          type: integer
    Notification:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        type:
          type: string
        message:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Bad Request
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Unauthorized
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: Internal Server Error
    BadRequestText:
      description: Bad Request
      content:
        text/plain:
          schema:
            type: string
          example: bad request
    UnauthorizedText:
      description: Unauthorized
      content:
        text/plain:
          schema:
            type: string
          example: Unauthorized
    InternalServerErrorText:
      description: Internal Server Error
      content:
        text/plain:
          schema:
            type: string
          example: internal error
    CreatedText:
      description: Created
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
            example:
              message: created successfully